<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMS – MGH Housestaff Quick Reference</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #f0f0f8;
  --muted: #888899;
  --accent: #7c6bff;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Header ── */
#app-header {
  position: fixed; top:0; left:0; right:0; z-index:100;
  background: rgba(10,10,15,0.9);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 56px;
}

.logo {
  font-size: 22px; font-weight: 700; letter-spacing: -0.5px;
  background: linear-gradient(135deg, #7c6bff, #e96bff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.logo-sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; letter-spacing: 0.5px; }

.search-wrap {
  flex: 1; max-width: 420px; margin: 0 2rem;
  position: relative;
}

#global-search {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 8px 16px 8px 40px;
  color: var(--text);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
#global-search:focus { border-color: var(--accent); }
#global-search::placeholder { color: var(--muted); }

.search-icon {
  position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
  color: var(--muted); font-size: 15px;
}

.header-pill {
  font-size: 11px; background: rgba(124,107,255,0.15); border: 1px solid rgba(124,107,255,0.3);
  color: #a89fff; border-radius: 20px; padding: 4px 12px; white-space: nowrap;
}

/* ── Sidebar ── */
#sidebar {
  position: fixed; top: 56px; left: 0; bottom: 0; width: 220px; z-index: 90;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 1rem 0;
}

#sidebar::-webkit-scrollbar { width: 4px; }
#sidebar::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.sys-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; border: none; background: none; cursor: pointer;
  padding: 9px 16px;
  color: var(--muted);
  font-family: inherit; font-size: 13px; font-weight: 500;
  text-align: left;
  transition: all 0.15s;
  border-radius: 0;
  position: relative;
}
.sys-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.sys-btn.active {
  color: var(--text);
  background: rgba(124,107,255,0.12);
}
.sys-btn.active::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--sys-color, #7c6bff);
  border-radius: 0 2px 2px 0;
}
.sys-dot {
  width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  background: var(--sys-color, #7c6bff);
}

/* ── Main ── */
#main {
  margin-left: 220px;
  padding-top: 56px;
  min-height: 100vh;
}

#content-area {
  padding: 2rem;
  max-width: 1100px;
}

/* ── Home splash ── */
#home-view .greeting {
  font-size: 32px; font-weight: 700; letter-spacing: -1px; margin-bottom: 6px;
}
#home-view .subgreet {
  font-size: 15px; color: var(--muted); margin-bottom: 2.5rem;
}

.systems-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 2.5rem;
}

.sys-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 1.2rem 1rem;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.sys-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--sys-color, #7c6bff);
}
.sys-card:hover {
  border-color: var(--border2);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}
.sys-card-icon { font-size: 26px; margin-bottom: 8px; }
.sys-card-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
.sys-card-topics { font-size: 11px; color: var(--muted); line-height: 1.5; }

.quick-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 12px; margin-bottom: 2rem;
}
.stat-box {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 1rem;
}
.stat-num { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── System view ── */
#sys-view { display: none; }

.sys-header {
  display: flex; align-items: flex-start; gap: 1rem;
  margin-bottom: 1.5rem;
  padding-bottom: 1.5rem;
  border-bottom: 1px solid var(--border);
}
.sys-header-icon {
  width: 56px; height: 56px; border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; flex-shrink: 0;
}
.sys-header-name { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }
.sys-header-desc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }

.topics-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px;
}

.topic-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  padding: 1rem; cursor: pointer; transition: all 0.15s;
}
.topic-card:hover { border-color: var(--border2); background: var(--surface2); }
.topic-card-title {
  font-size: 14px; font-weight: 600; margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.topic-tag {
  font-size: 10px; font-family: 'JetBrains Mono', monospace;
  background: rgba(124,107,255,0.15); color: #a89fff;
  border-radius: 6px; padding: 1px 7px;
}
.topic-preview { font-size: 12px; color: var(--muted); line-height: 1.6; }

/* ── Detail view ── */
#detail-view { display: none; }

.detail-back {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--muted); cursor: pointer; margin-bottom: 1.5rem;
  background: none; border: none; font-family: inherit;
  transition: color 0.15s;
}
.detail-back:hover { color: var(--text); }

.detail-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.detail-system { font-size: 12px; margin-bottom: 2rem; }
.detail-system span {
  padding: 3px 10px; border-radius: 20px; font-weight: 500;
}

.detail-body {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
}

.detail-section {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 1.2rem;
}
.detail-section.full { grid-column: 1 / -1; }

.detail-section h3 {
  font-size: 11px; font-weight: 600; color: var(--muted);
  letter-spacing: 0.8px; text-transform: uppercase;
  margin-bottom: 10px;
}

.detail-list { list-style: none; }
.detail-list li {
  font-size: 13px; line-height: 1.7; color: var(--text);
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
}
.detail-list li:last-child { border-bottom: none; }

.pill-list { display: flex; flex-wrap: wrap; gap: 6px; }
.pill {
  font-size: 12px; padding: 3px 10px; border-radius: 20px;
  border: 1px solid var(--border2); color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
}

.alert-box {
  border-radius: 10px; padding: 10px 14px;
  font-size: 13px; line-height: 1.6; margin-bottom: 8px;
}
.alert-red { background: rgba(220,53,69,0.12); border: 1px solid rgba(220,53,69,0.25); color: #ff8a8a; }
.alert-yellow { background: rgba(255,193,7,0.1); border: 1px solid rgba(255,193,7,0.2); color: #ffd970; }
.alert-green { background: rgba(25,135,84,0.12); border: 1px solid rgba(25,135,84,0.25); color: #6fcf97; }
.alert-blue { background: rgba(13,110,253,0.12); border: 1px solid rgba(13,110,253,0.25); color: #7db8ff; }

.dose-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.dose-table th {
  text-align: left; font-size: 11px; color: var(--muted);
  letter-spacing: 0.5px; font-weight: 600;
  padding: 4px 8px; border-bottom: 1px solid var(--border);
}
.dose-table td { padding: 6px 8px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.dose-table tr:last-child td { border-bottom: none; }
.mono { font-family: 'JetBrains Mono', monospace; color: #a89fff; }

/* ── Search overlay ── */
#search-results {
  position: fixed; top: 56px; left: 220px; right: 0; z-index: 80;
  background: rgba(10,10,15,0.97);
  backdrop-filter: blur(16px);
  display: none;
  max-height: calc(100vh - 56px); overflow-y: auto;
  padding: 1.5rem 2rem;
}
#search-results.visible { display: block; }
.sr-label { font-size: 11px; color: var(--muted); letter-spacing: 0.6px; margin-bottom: 10px; }
.sr-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px; border-radius: 8px; cursor: pointer;
  transition: background 0.1s;
}
.sr-item:hover { background: var(--surface); }
.sr-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sr-name { font-size: 14px; font-weight: 500; }
.sr-sys { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* ── Animations ── */
@keyframes fadeIn { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform:none; } }
.fade-in { animation: fadeIn 0.25s ease both; }

/* ── Responsive ── */
@media (max-width: 768px) {
  #sidebar { width: 100%; height: auto; position: relative; top: 56px; flex-direction: row; overflow-x: auto; display: flex; padding: 0; border-right: none; border-bottom: 1px solid var(--border); }
  #main { margin-left: 0; }
  .sys-btn { white-space: nowrap; padding: 10px 14px; }
  .sys-btn.active::before { top: auto; bottom: 0; left: 0; right: 0; width: auto; height: 3px; border-radius: 2px 2px 0 0; }
  .detail-body { grid-template-columns: 1fr; }
  #search-results { left: 0; }
}
</style>
</head>
<body>

<header id="app-header">
  <div>
    <div class="logo">AMS</div>
    <div class="logo-sub">MGH HOUSESTAFF · 2024–2025</div>
  </div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="global-search" placeholder="Search any topic, drug, condition…" autocomplete="off">
  </div>
  <div class="header-pill">30th Edition</div>
</header>

<nav id="sidebar"></nav>

<main id="main">
  <div id="content-area">
    <div id="home-view"></div>
    <div id="sys-view"></div>
    <div id="detail-view"></div>
  </div>
</main>

<div id="search-results"></div>

<script>
const SYSTEMS = [
  {
    id: 'cardiology', name: 'Cardiology', icon: '🫀',
    color: '#ff6b8a',
    desc: 'ACLS, arrhythmias, heart failure, cath, devices, valvular disease & more',

      {
        id: 'acls-arrest', title: 'ACLS: Cardiac Arrest & TTM', tag: 'EMERGENCY',

          keyPoints: [
            'Compress 2–2.4" deep at 100–120 BPM; minimize interruptions',
            'Default MGH strategy: avoid fever (T>37.7°C), aggressive cooling',

            'Pan-culture; consider aggressive antibiotics (aspiration risk, gut ischemia)',
            'H&P algorithm: H\'s and T\'s to identify reversible causes'
          ],
          alerts: [
            { type:'red', text:'If fever develops post-arrest: pan-culture, treat aggressively — infection vs inflammatory response' },
            { type:'blue', text:'TTM 33–36°C for 24h if comatose post-ROSC (Arch Intern Med 2001)' }

            { name:'Lidocaine', dose:'1–1.5 mg/kg', note:'Alternative to amiodarone' },
          ],
          ddx: ['VF/pVT → defibrillate', 'PEA/asystole → H\'s & T\'s', 'Hypothermia, Hypoxia, H+ (acidosis)', 'Tension PTX, Tamponade, Toxins', 'Thrombosis (PE, MI)']
        }
      },
      {
        id: 'bradycardia', title: 'ACLS: Bradycardia', tag: 'ACLS',
        preview: 'Unstable bradycardia, atropine, pacing protocols',
        sections: {
          keyPoints: [
            'Unstable signs: hypotension, AMS, ischemic chest pain, acute HF/pulm edema',
            'Atropine 1mg q3–5min (max 3mg); avoid in Mobitz II or CHB',
            'Dopamine infusion 5–20 mcg/kg/min OR Epinephrine 2–10 mcg/min',
            'Transcutaneous pacing: set rate 100 BPM, output 100mA → titrate down',
            'Do NOT give atropine post-heart transplant (denervated heart)',
          ],
          alerts: [
            { type:'red', text:'If unstable → medications + low threshold to pace immediately' },
            { type:'yellow', text:'Transcutaneous pacing requires procedural sedation: lorazepam 2mg + dilaudid 2mg (emergent) or RICU fentanyl/midazolam' }
          ],
          drugs: [
            { name:'Atropine', dose:'1mg IV q3–5min (max 3mg)', note:'First-line; 2h half-life' },
            { name:'Dopamine', dose:'5–20 mcg/kg/min IV infusion', note:'Second-line' },
            { name:'Epinephrine', dose:'2–10 mcg/min IV infusion', note:'Alternative to dopamine' },
          ],
          ddx: ['AV block (Mobitz I, II, CHB)', 'Sinus node dysfunction', 'Drug toxicity (BB, CCB, digoxin)', 'Hyperkalemia', 'Hypothyroidism', 'Inferior MI (RCA occlusion)']
        }
      },
      {
        id: 'tachycardia', title: 'ACLS: Tachycardia', tag: 'ACLS',
        preview: 'Wide vs narrow complex, regular vs irregular, cardioversion thresholds',
        sections: {
          keyPoints: [
            'Assess: stable vs unstable (hypotension, AMS, ischemia, acute HF)',
            'Narrow regular: adenosine → IV BB or dilt → amiodarone',
            'Narrow irregular (AF+RVR, MAT): IV BB or dilt; consider amio; check AC status before rhythm control',
            'Wide irregular (VT, TdP): lido + 2g Mg; for TdP: 2–4g Mg + overdrive pacing',
            'If ANY doubt about VT vs SVT with aberrancy → treat as VT'
          ],
          alerts: [
            { type:'red', text:'Unstable → immediate synchronized cardioversion (except pulseless → defibrillate)' },
            { type:'yellow', text:'Do NOT give adenosine for irregular wide-complex (may precipitate VF in AF+WPW)' }
          ],
          drugs: [
            { name:'Adenosine', dose:'6mg rapid IV push, repeat 12mg x2', note:'Narrow regular only' },
            { name:'Metoprolol', dose:'2.5–5mg IV over 2min, q5min x3', note:'Rate control' },
            { name:'Diltiazem', dose:'0.25 mg/kg IV over 2min', note:'Rate control; avoid in HFrEF' },
            { name:'Amiodarone', dose:'150mg IV over 10min, then 1mg/min x6h', note:'Rhythm/rate' },
          ],
          ddx: ['SVT (AVNRT, AVRT)', 'AF/AFL + RVR', 'Atrial tachycardia', 'VT (treat if any doubt)', 'Pre-excitation (WPW)']
        }
      },
      {
        id: 'afib', title: 'Atrial Fibrillation & Flutter', tag: 'ARRHYTHMIA',
        preview: 'Rate vs rhythm control, CHA₂DS₂-VASc, cardioversion, anticoagulation',
        sections: {
          keyPoints: [
            'Rate control targets: HR <110 at rest (RACE II); <80 if sx persist (AFFIRM)',
            'CHA₂DS₂-VASc: CHF, HTN, Age≥75 (x2), DM, Stroke/TIA (x2), Vasc dz, Age 65–74, Sex (F)',
            'Anticoagulate if CHA₂DS₂-VASc ≥2 (M) or ≥3 (F); DOAC preferred over warfarin',
            'Consider AF burden when estimating stroke risk (JAMA Card 2018)',
            'Rhythm control preferred for: younger pts, symptomatic, HF, or first presentation',
            'Prior to cardioversion: if AF ≥48h or unknown → TEE to r/o LAA thrombus OR anticoagulate x3wks'
          ],
          alerts: [
            { type:'red', text:'Hemodynamically unstable AF → immediate synchronized cardioversion (100–200J biphasic)' },
            { type:'yellow', text:'HAS-BLED score ≥3: caution with anticoagulation; assess bleeding risk' },
            { type:'blue', text:'SPARCtool: aids risk/benefit assessment and anticoagulant choice' }
          ],
          drugs: [
            { name:'Metoprolol', dose:'2.5–5mg IV or 25–200mg PO', note:'Rate control; preferred in HFrEF' },
            { name:'Diltiazem', dose:'0.25 mg/kg IV or 30–360mg PO', note:'Rate control; avoid HFrEF' },
            { name:'Apixaban', dose:'5mg BID (2.5mg BID if 2/3 criteria*)', note:'Preferred DOAC for AC' },
            { name:'Amiodarone', dose:'150mg IV then 1mg/min', note:'Rhythm control; chemical cardioversion' },
          ],
          ddx: ['New AF vs known/recurrent', 'Thyrotoxicosis', 'PE, pneumonia, sepsis', 'Acute MI', 'EtOH binge ("holiday heart")']
        }
      },
      {
        id: 'hf', title: 'Inpatient Heart Failure', tag: 'HF',
        preview: 'Diuresis, hemodynamic profiles, volume assessment, discharge planning',
        sections: {
          keyPoints: [
            'Classify: HFrEF (EF<40%), HFmrEF (40–49%), HFpEF (≥50%)',
            'Hemodynamic profile: wet/dry × warm/cold; goal: warm & dry',
            'Diuresis: IV furosemide at ≥ PO dose × 2.5; target UOP 3–5 L/day; check BMP q12h',
            'Monitor: daily weights, strict I/Os, creatinine, K, Na',
            'Signs of inadequate decongestion: JVD, orthopnea, peripheral edema, elevated BNP',
            'Discharge criteria: euvolemic, on oral diuretics, tolerating GDMT, education complete'

          alerts: [
            { type:'red', text:'Cold/wet profile (CS3): consider inotropes (dobutamine) ± MCS; urgent cath if ischemia' },

            { type:'green', text:'GDMT for HFrEF: ACEi/ARB/ARNI + BB + MRA + SGLT2i (quadruple therapy target)' }
          ],
          drugs: [
            { name:'Furosemide IV', dose:'1–2.5× PO dose; max ~200mg single dose', note:'Loop diuretic 1st line' },
            { name:'Bumetanide IV', dose:'1mg = 40mg furosemide', note:'Alternative if furosemide allergy' },
            { name:'Metolazone', dose:'2.5–10mg PO 30min before loop', note:'Thiazide for resistance' },
            { name:'Sacubitril/Val', dose:'24/26 mg BID → titrate to 97/103 BID', note:'ARNI for HFrEF EF<35%' },
          ],
          ddx: ['Fluid overload vs low CO vs both', 'ACS precipitant', 'Myocarditis', 'Arrhythmia', 'Medication non-adherence', 'Dietary indiscretion']
        }
      },
      {
        id: 'acs', title: 'Acute Coronary Syndrome', tag: 'EMERGENCY',
        preview: 'STEMI, NSTEMI, UA management, cath timing, dual antiplatelet',
        sections: {
          keyPoints: [
            'STEMI: PCI within 90min (door-to-balloon); fibrinolytics if PCI unavailable within 120min',
            'NSTEMI/UA risk stratify: HEART score, TIMI, GRACE for cath timing',
            'Troponin: rises 3–6h after onset; peak 12–24h; use hs-troponin for early rule-out',
            'Antiplatelet: aspirin 325mg load → 81mg daily + P2Y12 inhibitor (ticagrelor preferred)',
            'Anticoagulation: UFH drip or enoxaparin 1mg/kg q12h; hold in STEMI after PCI if no clot burden',
            'BB, statin, ACEi within 24h of STEMI if tolerated'
          ],
          alerts: [
            { type:'red', text:'STEMI → activate cath lab immediately; dual antiplatelet + anticoagulation NOW' },
            { type:'yellow', text:'High-risk features for urgent cath: dynamic EKG changes, hemodynamic instability, refractory sx' }
          ],
          drugs: [
            { name:'Aspirin', dose:'325mg PO load → 81mg daily', note:'Irreversible COX inhibition' },

            { name:'UFH', dose:'60 U/kg bolus (max 4000U) → 12 U/kg/hr', note:'Target PTT 50–70s' },
          ],
          ddx: ['Type 1 MI (plaque rupture)', 'Type 2 MI (supply-demand mismatch)', 'MINOCA', 'Myocarditis', 'Takotsubo', 'PE (troponin rise)']
        }
      },
      {
        id: 'syncope', title: 'Syncope', tag: 'WORKUP',

          ],
          alerts: [

            { type:'yellow', text:'ROSE criteria: elevated BNP >300, hemoccult positive, hemoglobin <9 → high risk, admit' }
          ],
          drugs: [],

  {
    id: 'pulmonary', name: 'Pulmonary & Critical Care', icon: '🫁',

      {

        sections: {
          keyPoints: [

let currentSystem = null;
let currentTopic = null;

function getSystemColor(sysId) {
  const sys = SYSTEMS.find(s => s.id === sysId);
  return sys ? sys.color : '#7c6bff';
}

function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  sidebar.innerHTML = SYSTEMS.map(sys => `
    <button class="sys-btn" style="--sys-color:${sys.color}" onclick="showSystem('${sys.id}')">
      <span class="sys-dot" style="background:${sys.color}"></span>
      ${sys.name}
    </button>
  `).join('');
}

  currentSystem = null;
  currentTopic = null;
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('sys-view').style.display = 'none';

    <div class="fade-in">

function showSystem(sysId) {
  currentSystem = sysId;
  currentTopic = null;
  const sys = SYSTEMS.find(s => s.id === sysId);
  document.getElementById('home-view').style.display = 'none';
  document.getElementById('sys-view').style.display = 'block';
  document.getElementById('detail-view').style.display = 'none';
  document.querySelectorAll('.sys-btn').forEach(b => b.classList.remove('active'));
  var activeBtn = document.querySelector('.sys-btn[onclick="showSystem(\'' + sysId + '\')"]'); if(activeBtn) activeBtn.classList.add('active');

  document.getElementById('sys-view').innerHTML = `
    <div class="fade-in">
      <div class="sys-header">
        <div class="sys-header-icon" style="background:${sys.color}22">${sys.icon}</div>
        <div>
          <div class="sys-header-name">${sys.name}</div>
          <div class="sys-header-desc">${sys.desc}</div>
        </div>
      </div>
      <div class="topics-grid">
        ${sys.topics.map(t => `
          <div class="topic-card" onclick="showTopic('${sysId}','${t.id}')">
            <div class="topic-card-title">
              ${t.title}
              <span class="topic-tag">${t.tag}</span>
            </div>
            <div class="topic-preview">${t.preview}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function showTopic(sysId, topicId) {
  const sys = SYSTEMS.find(s => s.id === sysId);
  const topic = sys.topics.find(t => t.id === topicId);
  currentSystem = sysId;
  currentTopic = topicId;

  document.getElementById('home-view').style.display = 'none';
  document.getElementById('sys-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';

  const s = topic.sections;
  const alertsHtml = s.alerts && s.alerts.length ? s.alerts.map(function(a) { return '<div class="alert-box alert-' + a.type + '">' + a.text + '</div>'; }).join('') : '';
  const drugsHtml = s.drugs && s.drugs.length ? '<table class="dose-table"><thead><tr><th>Drug</th><th>Dose</th><th>Notes</th></tr></thead><tbody>' + s.drugs.map(function(d) { return '<tr><td class="mono">' + d.name + '</td><td>' + d.dose + '</td><td style="color:var(--muted);font-size:11px">' + d.note + '</td></tr>'; }).join('') + '</tbody></table>' : '<span style="color:var(--muted);font-size:13px">See system guidelines</span>';
  const ddxHtml = s.ddx && s.ddx.length ? '<div class="pill-list">' + s.ddx.map(function(d) { return '<span class="pill">' + d + '</span>'; }).join('') + '</div>' : '';

  document.getElementById('detail-view').innerHTML = `
    <div class="fade-in">
      <button class="detail-back" onclick="showSystem('${sysId}')">← Back to ${sys.name}</button>
      <div class="detail-title">${topic.title}</div>
      <div class="detail-system"><span style="background:${sys.color}22;color:${sys.color};padding:3px 10px;border-radius:20px">${sys.icon} ${sys.name}</span></div>
      <div class="detail-body">
        <div class="detail-section full">
          <h3>Key Points</h3>
          <ul class="detail-list">${s.keyPoints.map(function(p){return '<li>'+p+'</li>';}).join('')}</ul>
        </div>
        ${alertsHtml ? '<div class="detail-section full"><h3>Alerts &amp; Pearls</h3>' + alertsHtml + '</div>' : ''}
        <div class="detail-section">
          <h3>Medications &amp; Dosing</h3>
          ${drugsHtml}
        </div>
        ${ddxHtml ? '<div class="detail-section"><h3>Differential Diagnosis</h3>' + ddxHtml + '</div>' : ''}
      </div>
    </div>
  `;
}

// Search
const searchIndex = [];
SYSTEMS.forEach(sys => {
  sys.topics.forEach(t => {
    searchIndex.push({ sys, topic: t });
  });
});

const searchInput = document.getElementById('global-search');
const searchResults = document.getElementById('search-results');

searchInput.addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { searchResults.classList.remove('visible'); return; }
  const matches = searchIndex.filter(({sys, topic}) =>
    topic.title.toLowerCase().includes(q) ||
    topic.preview.toLowerCase().includes(q) ||
    topic.tag.toLowerCase().includes(q) ||
    sys.name.toLowerCase().includes(q) ||
    (topic.sections.ddx || []).some(d => d.toLowerCase().includes(q)) ||
    (topic.sections.keyPoints || []).some(k => k.toLowerCase().includes(q)) ||
    (topic.sections.drugs || []).some(d => d.name.toLowerCase().includes(q))
  );
  if (matches.length === 0) {
    searchResults.innerHTML = `<div class="sr-label">No results for "${this.value}"</div>`;
  } else {
    searchResults.innerHTML = `
      <div class="sr-label">${matches.length} RESULT${matches.length !== 1 ? 'S' : ''}</div>
      ${matches.map(({sys, topic}) => `
        <div class="sr-item" onclick="selectResult('${sys.id}','${topic.id}')">
          <span class="sr-dot" style="background:${sys.color}"></span>
          <div>
            <div class="sr-name">${highlight(topic.title, q)}</div>
            <div class="sr-sys">${sys.name} · ${topic.tag}</div>
          </div>
        </div>
      `).join('')}
    `;
  }
  searchResults.classList.add('visible');
});

function highlight(text, q) {
  const idx = text.toLowerCase().indexOf(q);
  if (idx === -1) return text;
  return text.slice(0, idx) + '<span style="color:#7c6bff;font-weight:600">' + text.slice(idx, idx + q.length) + '</span>' + text.slice(idx + q.length);
}

function selectResult(sysId, topicId) {
  searchResults.classList.remove('visible');
  searchInput.value = '';
  showTopic(sysId, topicId);
}

document.addEventListener('click', function(e) {
  if (!searchInput.contains(e.target) && !searchResults.contains(e.target)) {
    searchResults.classList.remove('visible');
  }
});

searchInput.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { searchResults.classList.remove('visible'); this.value = ''; }
});

// Logo click → home
document.querySelector('.logo').addEventListener('click', showHome);

// Init
renderSidebar();
showHome();
</script>
</body>
</html>
